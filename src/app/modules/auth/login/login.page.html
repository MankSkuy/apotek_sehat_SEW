<div class="login-wrapper">
  <!-- Background overlay -->
  <div class="login-bg"></div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-circle">
        <ion-icon name="bandage-outline"></ion-icon>
      </div>
      <h1>Apotek Sehat</h1>
      <p>Sistem Manajemen Apotek</p>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-switcher">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'masuk'"
        (click)="switchTab('masuk')"
      >
        Masuk
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'daftar'"
        (click)="switchTab('daftar')"
      >
        Daftar
      </button>
    </div>

    <!-- Login Form -->
    <form *ngIf="activeTab === 'masuk'" (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input
            type="text"
            placeholder="Masukkan username"
            [(ngModel)]="username"
            name="username"
            id="login-username"
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Masukkan password"
            [(ngModel)]="password"
            name="password"
            id="login-password"
            autocomplete="current-password"
          />
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            class="input-icon-right"
            (click)="togglePassword()"
          ></ion-icon>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading || !username || !password" id="btn-login">
        <ion-icon name="log-in-outline" *ngIf="!isLoading"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        {{ isLoading ? 'Memproses...' : 'Masuk ke Sistem' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="activeTab === 'daftar'" (ngSubmit)="register()" class="login-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input
            type="text"
            placeholder="Pilih username"
            [(ngModel)]="regUsername"
            name="regUsername"
            id="reg-username"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input
            type="password"
            placeholder="Buat password"
            [(ngModel)]="regPassword"
            name="regPassword"
            id="reg-password"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Konfirmasi Password</label>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input
            type="password"
            placeholder="Ulangi password"
            [(ngModel)]="regConfirmPassword"
            name="regConfirmPassword"
            id="reg-confirm-password"
          />
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading" id="btn-register">
        <ion-icon name="person-add-outline" *ngIf="!isLoading"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        {{ isLoading ? 'Memproses...' : 'Daftar Akun' }}
      </button>
    </form>

    <!-- Demo Info -->
    <div class="demo-info" *ngIf="activeTab === 'masuk'" (click)="fillDemo()">
      <div class="demo-title">
        <ion-icon name="key-outline"></ion-icon>
        Akun Demo:
      </div>
      <div class="demo-cred">
        <span>Username: <strong>admin</strong></span>
        <span>Password: <strong>admin123</strong></span>
      </div>
    </div>
  </div>
</div>
